kind: Pod
apiVersion: v1
metadata:
  name: foobar
  labels:
    name: foobar
spec:
  containers:
    - name: foobar
      image: nginx
      ports:
        - containerPort: 80
          name: "http-server"
      volumeMounts:
      - mountPath: "/usr/share/nginx/html"
        name: pvol
  volumes:
    - name: pvol
      persistentVolumeClaim:
       claimName: csi-pvc
